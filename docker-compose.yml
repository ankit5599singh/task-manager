services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: task_manager_app
        restart: unless-stopped
        init: true
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - vendor_data:/var/www/html/vendor
        ports:
            - "8000:8000"
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: task_manager
            DB_USERNAME: developer
            DB_PASSWORD: password
        depends_on:
            mysql:
                condition: service_healthy
        command: >
            sh -c "composer install --no-interaction --prefer-dist &&
            php artisan serve --host=0.0.0.0 --port=8000"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    mysql:
        image: mysql:8.4
        container_name: task_manager_mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: task_manager
            MYSQL_USER: developer
            MYSQL_PASSWORD: password
            MYSQL_ROOT_PASSWORD: rootpassword
        ports:
            - "127.0.0.1:3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - -h
                - localhost
                - -uroot
                - -prootpassword
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s

    vite:
        build:
            context: .
            dockerfile: Dockerfile.vite
        container_name: task_manager_vite
        restart: unless-stopped
        init: true
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - node_modules_data:/var/www/html/node_modules
            - vendor_data:/var/www/html/vendor
        ports:
            - "5173:5173"
        depends_on:
            app:
                condition: service_healthy
        command: >
            sh -c "if [ -f package-lock.json ];
            then npm ci;
            else npm install;
            fi &&
            npm run dev -- --host 0.0.0.0 --strictPort"

volumes:
    mysql_data:
        driver: local
    vendor_data:
        driver: local
    node_modules_data:
        driver: local
